! ==============================================================================
! CISCO PACKET TRACER CONFIGURATION
! Device: ADMIN-ACC (Catalyst 2960-24TT)
! Location: Warden's Administrative Office
! ==============================================================================
enable
configure terminal
hostname ADMIN-ACC
no ip domain-lookup
ip domain-name hostel.local
enable secret Cisco@Hostel2026!
username netadmin privilege 15 secret Admin@Access2026!
vtp mode transparent
spanning-tree mode rapid-pvst
ip ssh version 2
crypto key generate rsa modulus 1024

vlan 50
 name ADMIN
vlan 90
 name NETWORK_MGMT
vlan 999
 name UNUSED_NATIVE

interface vlan 90
 description In-Band Management Interface
 ip address 10.20.20.19 255.255.255.0
 no shutdown

ip default-gateway 10.20.20.1

ip access-list standard MGMT-SSH
 permit host 10.20.20.10
 deny any

! Trunk to HOSTEL-CORE
interface gigabitEthernet0/1
 description Uplink to HOSTEL-CORE Gi1/0/9
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 50,90,999
 no shutdown

interface gigabitEthernet0/2
 description Unused Uplink
 shutdown

! Warden and Admin Workstations (VLAN 50)
interface range fastEthernet0/1-8
 description Warden & Admin Staff Workstations (VLAN 50)
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Unused Ports - Disabled for Security
interface range fastEthernet0/9-24
 description Unused Ports - Disabled
 shutdown

line vty 0 15
 login local
 transport input ssh
 access-class MGMT-SSH in

end
write memory
