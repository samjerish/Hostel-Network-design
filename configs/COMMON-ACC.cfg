! ==============================================================================
! CISCO PACKET TRACER CONFIGURATION
! Device: COMMON-ACC (Catalyst 2960-24TT)
! Location: Student Recreation & Common Room
! ==============================================================================
enable
configure terminal
hostname COMMON-ACC
no ip domain-lookup
ip domain-name hostel.local
enable secret Cisco@Hostel2026!
username netadmin privilege 15 secret Admin@Access2026!
vtp mode transparent
spanning-tree mode rapid-pvst
ip ssh version 2
crypto key generate rsa modulus 1024

vlan 90
 name NETWORK_MGMT
vlan 100
 name COMMON_STUDENTS
vlan 999
 name UNUSED_NATIVE

interface vlan 90
 description In-Band Management Interface
 ip address 10.20.20.21 255.255.255.0
 no shutdown

ip default-gateway 10.20.20.1

ip access-list standard MGMT-SSH
 permit host 10.20.20.10
 deny any

! Trunk to HOSTEL-CORE
interface gigabitEthernet0/1
 description Uplink to HOSTEL-CORE Gi1/0/11
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 90,100,999
 no shutdown

interface gigabitEthernet0/2
 description Unused Uplink
 shutdown

! Common Room Wireless APs (3 APs, VLAN 100)
interface range fastEthernet0/1-3
 description Common Room Wi-Fi Access Points (VLAN 100)
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Common Room Student Study Table Wired Outlets (VLAN 100)
interface range fastEthernet0/4-12
 description Student Study Table Ethernet Outlets (VLAN 100)
 switchport mode access
 switchport access vlan 100
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Unused Ports - Disabled for Security
interface range fastEthernet0/13-24
 description Unused Ports - Disabled
 shutdown

line vty 0 15
 login local
 transport input ssh
 access-class MGMT-SSH in

end
write memory
