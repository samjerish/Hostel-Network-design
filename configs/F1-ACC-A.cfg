! ==============================================================================
! CISCO PACKET TRACER CONFIGURATION
! Device: F1-ACC-A (Catalyst 2960-48TT)
! Location: Floor 1 - North Wing (Rooms 1-15, 3 APs, 4 CCTV Cameras)
! ==============================================================================
enable
configure terminal
hostname F1-ACC-A
no ip domain-lookup
ip domain-name hostel.local
enable secret Cisco@Hostel2026!
username netadmin privilege 15 secret Admin@Access2026!
vtp mode transparent
spanning-tree mode rapid-pvst
ip ssh version 2
crypto key generate rsa modulus 1024

vlan 10
 name STUDENT_F1
vlan 70
 name CCTV
vlan 90
 name NETWORK_MGMT
vlan 999
 name UNUSED_NATIVE

interface vlan 90
 description In-Band Management Interface
 ip address 10.20.20.11 255.255.255.0
 no shutdown

ip default-gateway 10.20.20.1

ip access-list standard MGMT-SSH
 permit host 10.20.20.10
 deny any

! Trunk to HOSTEL-CORE
interface gigabitEthernet0/1
 description Uplink to HOSTEL-CORE Gi1/0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,70,90,999
 no shutdown

interface gigabitEthernet0/2
 description Unused Uplink
 shutdown

! Student Wired Outlets: Rooms 1 to 15 (2 ports per room = 30 ports)
interface range fastEthernet0/1-30
 description Student Room Wired Outlets (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Wireless Access Points (3 APs on Wing A)
interface range fastEthernet0/31-33
 description Floor 1 Wi-Fi Access Points (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! IP Surveillance Cameras (4 Cameras on Wing A)
interface range fastEthernet0/34-37
 description Floor 1 IP CCTV Cameras (VLAN 70)
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! Unused Ports - Disabled for Security
interface range fastEthernet0/38-48
 description Unused Ports - Disabled
 shutdown

line vty 0 15
 login local
 transport input ssh
 access-class MGMT-SSH in

end
write memory
